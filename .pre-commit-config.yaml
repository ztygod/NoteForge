# Keep hooks reproducible by pinning every external repository to an exact version.
minimum_pre_commit_version: "4.0.0"
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # Run lint fixes before formatting so the formatter sees the final imports.
      - id: ruff-check
        name: Ruff lint
        args: [--fix]
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # Use the locked project environment instead of a separate hook environment.
      - id: pytest
        name: Python tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
