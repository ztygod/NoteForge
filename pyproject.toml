[project]
name = "noteforge-cli"
version = "0.1.0"
description = "Generate structured study notes from public course videos"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "ztygod" },
]
keywords = [
    "bilibili",
    "cli",
    "learning-notes",
    "llm",
    "subtitles",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "cryptography>=45,<48",
    "httpx>=0.28,<1",
    "keyring>=25,<27",
    "playwright>=1.48,<2",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "yt-dlp[curl-cffi]>=2026.7.4",
]

[project.urls]
Homepage = "https://github.com/ztygod/NoteForge"
Repository = "https://github.com/ztygod/NoteForge"
Issues = "https://github.com/ztygod/NoteForge/issues"

[project.scripts]
noteforge = "noteforge.cli.app:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8,<9",
    "ruff>=0.16.2",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "noteforge"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
