[project]
name = "noteforge"
version = "0.1.0"
description = "Generate structured study notes from public course videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
    "typer>=0.12,<1",
]

[project.scripts]
noteforge = "noteforge.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"
